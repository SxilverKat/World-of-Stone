# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true

# Mod properties
mod.version=1.4.1
mod.group=com.sxilverr.worldofstone
mod.id=worldofstone
mod.name=World of Stone

# Mod metadata - overridden per Minecraft version in versions/<ver>/gradle.properties
mod.mc_dep_forgelike=[VERSIONED]
mod.mc_title=[VERSIONED]
mod.mc_targets=[VERSIONED]
# Architectury API is a hard runtime dependency (see deps.architectury_api).
mod.architectury_range=[VERSIONED]

# Loader version range shared across the 1.20.1 patch band
mod.forge_range=[47,)

# Loader deps - fabric_loader is version-independent; forge/jei are set per version.
deps.fabric_loader=0.16.5
deps.forge_loader=[VERSIONED]
deps.neoforge_loader=[VERSIONED]
deps.jei=[VERSIONED]
# Architectury API - cross-loader registration; set per version.
deps.architectury_api=[VERSIONED]
